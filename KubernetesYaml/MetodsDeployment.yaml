apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitter-deployment
  namespace: lesson
spec:
  selector:
    matchLabels:
      POD_LABEL: splitter-pod-label
  replicas: 2
  template:
    metadata:
      labels:
        POD_LABEL: splitter-pod-label
      namespace: lesson
    spec:
      containers:
        - name: splitter-container
          image: asia-south1-docker.pkg.dev/weje-2023/gke-weje-images-india/splitter:V3
          ports:
          - containerPort: 8080
          resources:
            requests:
              memory: "180Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 25
            timeoutSeconds: 20
            successThreshold: 1
            failureThreshold: 4
            tcpSocket:
              port: 8080
          livenessProbe:
            periodSeconds: 12
            timeoutSeconds: 8
            successThreshold: 1
            failureThreshold: 2
            tcpSocket:
              port: 8080
          readinessProbe:
            periodSeconds: 27
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 1
            tcpSocket:
              port: 8080