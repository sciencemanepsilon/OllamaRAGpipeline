apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: lesson
spec:
  selector:
    matchLabels:
      POD_LABEL: ollama-pod-label
  replicas: 1
  template:
    metadata:
      labels:
        POD_LABEL: ollama-pod-label
      namespace: lesson
    spec:
      volumes:
        - name: ollama-volume
          emptyDir: {}
      containers:
        - name: ollama-container
          image: alpine/ollama:latest
          ports:
          - containerPort: 11434
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
          volumeMounts:
            - name: ollama-volume
              mountPath: /root.ollama
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 25
            timeoutSeconds: 20
            successThreshold: 1
            failureThreshold: 4
            tcpSocket:
              port: 11434
          livenessProbe:
            exec:
              command:
              - ollama list
            periodSeconds: 12
            timeoutSeconds: 8
            successThreshold: 1
            failureThreshold: 2
          readinessProbe:
            periodSeconds: 27
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 1
            tcpSocket:
              port: 11434